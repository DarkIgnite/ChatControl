# ==============================================================
#                 ChatControl by Leftycraft
#      Advanced Chat Toggle, Server Mute, & Sound Plugin
#                  Paper 1.21+ Compatible
# ==============================================================

# Prefix for plugin messages
prefix: "<gradient:#00d2ff:#3a7bd5>[LeftyChat]</gradient> &8» &r"

# Sound settings when incoming chat messages arrive
# Suara chat akan otomatis HANYA berbunyi untuk player yang chat-nya AKTIF.
# Jika player mematikan chat (/chat toggle), suara chat TIDAK AKAN berbunyi.
sound:
  # Enable chat notification sound
  enabled: true
  # Sound key (Bukkit Sound / Minecraft Sound key)
  # Examples: minecraft:entity.experience_orb.pickup, minecraft:block.note_block.bell, minecraft:entity.item.pickup
  name: "minecraft:entity.experience_orb.pickup"
  volume: 1.0
  pitch: 1.0
  # Only play sound for players who have their chat enabled
  only-for-enabled-chat: true
  # PlayMoreSounds integration support
  playmoresounds-integration: true

# Server Mute settings
server-mute:
  # Whether server mute persists across restarts
  persist-state: true
  # Allow players with chatcontrol.bypass.muteall to chat during mute
  allow-permission-bypass: true

# Clear chat settings
clear-chat:
  lines: 100

# Messages configuration (Supports legacy color codes & and MiniMessage formatting <color>, <gradient>)
